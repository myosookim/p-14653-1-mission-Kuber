# 로드밸런서 : 클라우드 환경(AWS, GCP, Azure)에서 외부 로드 밸런서를 자동으로 생성하고 접근하는 Service 타입
# NodePort와 달리 표준 포트(80, 443)를 사용 가능
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
spec:
  type: LoadBalancer     # ⭐ 외부 로드밸런서 생성
  selector:
    app: nginx
  ports:
    - port: 80             # 외부 접근 포트 (80 사용 가능!)
      targetPort: 80       # Pod 포트